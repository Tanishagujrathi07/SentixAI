<!DOCTYPE html>
<html>

<head>

<title>Review Analysis</title>

<style>

body{
font-family:Arial;
background:#071a33;
text-align:center;
padding:40px
}

.card{
background:white;
max-width:650px;
margin:auto;
padding:30px;
border-radius:14px;
box-shadow:0 5px 18px #0005
}

.positive{color:green}
.negative{color:red}
.neutral{color:#d97700}

.action{
padding:15px;
background:#eef7fc;
border-radius:8px;
font-weight:bold
}

a{
display:inline-block;
margin-top:20px;
padding:12px 20px;
background:#0077b6;
color:white;
text-decoration:none;
border-radius:7px
}

</style>

</head>


<body>

<div class="card">

<h1>🔍 Your Review Analysis</h1>

<h3>{{ product }}</h3>

<p>"{{ review }}"</p>

<p>
Rating:
{% for i in range(rating) %}⭐{% endfor %}
</p>

<h2 class="{{ sentiment|lower }}">

{% if sentiment=="Positive" %}
😊 Positive
{% elif sentiment=="Negative" %}
😡 Negative
{% else %}
😐 Neutral
{% endif %}

</h2>

<div class="action">
💡 {{ action }}
</div>

<a href="/">
← Back to Dashboard
</a>

</div>

</body>
</html>
